<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1242" height="1660" viewBox="0 0 1242 1660">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#e8eee7" stop-opacity="0.56"/>
      <stop offset="0.5" stop-color="#eff3ed" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dce5dd" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26322f"/>
      <stop offset="0.52" stop-color="#101715"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
